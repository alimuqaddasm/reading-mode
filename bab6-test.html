<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Makarim ul Akhlaq Atlas, Bab 6: Satan, whispering, refuge. What four scholars teach, colour-coded by scholar.">
<title>Akhlaq Atlas · Bab 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gulzar&family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
/* Layout: a quiet reading desk. Contents drawer and Fasl rail on the start (right) side, one reading column,
   a bottom dock for back and forth. Scholar colour is the only loud element. */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --fg:#1a201e; --soft:#46504c; --faint:#626c68; --rule:#d5dad3; --wash:#e9ece6;
  --accent:#17605a; --accent-fg:#ffffff;
  --mm:#c22a22; --ah:#2a7a30; --ez:#7a2ea0; --js:#b85f00;
  --mm-w:#fbecea; --ah-w:#e8f3e8; --ez-w:#f3ebf8; --js-w:#fcf0e1;
  --kull:#17605a; --khushah:#33558a; --munfarid:#6e5c38; --flag:#1a201e;
  --f-ur:"Gulzar","Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  --f-x:"Vazirmatn",system-ui,sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --paper:#1a201e; --fg:#e8ede9; --soft:#bcc5c1; --faint:#98a29e; --rule:#323b38; --wash:#232a28;
  --accent:#7fcac2; --accent-fg:#0f1513;
  --mm:#ff7a70; --ah:#6fcd77; --ez:#cf9cf2; --js:#ffae4d;
  --mm-w:#36201e; --ah-w:#1c2f1e; --ez-w:#2d2236; --js-w:#34281b;
  --kull:#7fcac2; --khushah:#9db6e0; --munfarid:#d2bf95; --flag:#e8ede9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --paper:#1a201e; --fg:#e8ede9; --soft:#bcc5c1; --faint:#98a29e; --rule:#323b38; --wash:#232a28;
  --accent:#7fcac2; --accent-fg:#0f1513;
  --mm:#ff7a70; --ah:#6fcd77; --ez:#cf9cf2; --js:#ffae4d;
  --mm-w:#36201e; --ah-w:#1c2f1e; --ez-w:#2d2236; --js-w:#34281b;
  --kull:#7fcac2; --khushah:#9db6e0; --munfarid:#d2bf95; --flag:#e8ede9; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ur);direction:rtl;font-size:var(--fs);line-height:2.3}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
[lang="ar"],[lang="fa"]{font-family:var(--f-x);font-size:.95em;line-height:2}
[lang="en"],.ui{font-family:var(--f-x)}
[lang="en"]{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:30;background:var(--accent);color:var(--accent-fg);padding:4px 14px;border-radius:6px;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;cursor:pointer;text-decoration:none;color:var(--fg);font-family:var(--f-x);font-size:14px;line-height:1}
.btn:hover{border-color:var(--accent)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--fg);line-height:1.5}
.brand b{font-size:20px;font-weight:400;line-height:1.9}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 220px}
.crumb .where{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:2}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend button{min-height:36px;font-family:var(--f-ur);font-size:15px;line-height:1.9;border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:0 12px 3px;cursor:pointer;display:flex;align-items:center;gap:6px}
.legend button i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.legend button[aria-pressed="true"]{background:var(--c);color:var(--paper)}
.legend button[aria-pressed="true"] i{background:var(--paper)}
.legend .mm{--c:var(--mm)}.legend .ah{--c:var(--ah)}.legend .js{--c:var(--js)}.legend .ez{--c:var(--ez)}
.row2{max-width:1280px;margin:4px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* contents drawer */
.drawer{position:fixed;inset:0;z-index:40;display:flex}
.drawer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.panel{position:relative;width:min(420px,92vw);height:100%;background:var(--paper);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 30px 18px;box-shadow:0 0 30px rgba(0,0,0,.2)}
.panel h2{font-family:var(--f-x);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--faint);margin:20px 0 4px;text-transform:uppercase}
.panel .head{display:flex;justify-content:space-between;align-items:center}
.panel .head b{font-size:20px;font-weight:400}
.panel ol{list-style:none;margin:0;padding:0}
.panel a{display:flex;gap:10px;align-items:baseline;padding:4px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:17px;line-height:2.1}
.panel a:hover{background:var(--wash)}
.panel a[aria-current="page"]{background:var(--wash);box-shadow:inset -3px 0 0 var(--accent)}
.panel .sub{margin:2px 0 10px;padding-inline-start:18px;border-inline-start:2px solid var(--rule)}
.panel .sub h2{margin:8px 0 2px}
.panel .sub a{font-size:15px;line-height:2}
.panel a small{font-family:var(--f-x);font-size:12px;color:var(--faint);min-width:24px}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 110px}

/* home */
.home{max-width:1280px;margin:0 auto}
.hero{max-width:820px;padding-block:10px 20px}
.hero h1{font-size:34px;line-height:2.1;margin:0;font-weight:400;text-wrap:balance}
.hero p{color:var(--soft);margin:6px 0 0;font-size:18px}
.hero .en{font-family:var(--f-x);font-size:13px;color:var(--faint);margin-top:6px}
.continue{margin:4px 0 18px}
.part{margin:34px 0 10px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.part h2{font-size:21px;font-weight:400;margin:0;line-height:2}
.part span{font-family:var(--f-x);font-size:12px;color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{height:100%;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 18px 16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .n{font-family:var(--f-x);font-size:12px;color:var(--faint);letter-spacing:.06em}
.card h3{margin:0;font-size:21px;line-height:2;font-weight:400;text-wrap:balance}
.card .en{font-family:var(--f-x);font-size:12.5px;color:var(--faint);direction:ltr;text-align:right;line-height:1.5}
.card p{margin:2px 0 0;font-size:15.5px;color:var(--soft);line-height:2.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.vol{background:var(--wash)}
.share{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:auto;background:var(--wash)}
.share i{display:block;height:100%}
.share .mm{background:var(--mm)}.share .ah{background:var(--ah)}.share .js{background:var(--js)}.share .ez{background:var(--ez)}
.card .cnt{font-family:var(--f-x);font-size:12px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}

/* page */
.page{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:44px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px);overflow:auto;font-size:15px;line-height:2;padding-inline-end:6px}
.rail h2{font-size:12px;font-family:var(--f-x);color:var(--faint);font-weight:600;letter-spacing:.06em;margin:14px 0 4px;text-transform:uppercase}
.rail ol{list-style:none;margin:0;padding:0}
.rail a{display:flex;gap:8px;text-decoration:none;color:var(--soft);padding:3px 8px;border-radius:6px;border-inline-start:3px solid transparent}
.rail a:hover{background:var(--wash);color:var(--fg)}
.rail a.on{color:var(--fg);border-inline-start-color:var(--accent);background:var(--wash)}
.rail a.l3{padding-inline-start:22px;font-size:14px}
.rail a small{font-family:var(--f-x);font-size:11px;color:var(--faint);min-width:36px;padding-top:4px}
.reader{min-width:0;max-width:860px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:48px 0 0;border-top:1px solid var(--rule);padding-top:18px}
.pager a{display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--rule);border-radius:10px;text-decoration:none;color:var(--fg);background:var(--paper)}
.pager a:hover{border-color:var(--accent)}
.pager a small{font-family:var(--f-x);font-size:12px;color:var(--faint)}
.pager a.next{text-align:left;grid-column:2}

/* bottom dock */
.dock{position:fixed;inset:auto 0 0;z-index:15;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.dock[hidden]{display:none}
.dock-in{pointer-events:auto;display:flex;gap:4px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.14);max-width:100%}
.dock .btn{border:none;border-radius:999px;min-height:40px}
.dock .now{font-size:15px;padding:0 8px;max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:2.2}

/* fragment typography */
.reader h1{font-size:34px;line-height:2.2;margin:0 0 4px;font-weight:400;text-wrap:balance}
[tabindex="-1"]:focus{outline:none}
.reader .en{display:block;font-size:13px;font-weight:400;color:var(--faint);line-height:1.5;direction:ltr;text-align:right}
.reader h1 .en{font-size:14px}
.reader h2{font-size:22px;color:var(--fg);font-weight:400;margin:56px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--rule);line-height:2.1}
.reader h3{font-size:26px;line-height:2.2;margin:48px 0 4px;font-weight:400;text-wrap:balance}
.reader .code{font-family:var(--f-x);font-size:12px;color:var(--faint);display:block;line-height:1.3;direction:ltr;text-align:right}
.reader h4{font-size:19px;line-height:2.1;margin:24px 0 4px;font-weight:400}
.reader h4.kull .ur{color:var(--kull)}.reader h4.khushah .ur{color:var(--khushah)}.reader h4.munfarid .ur{color:var(--munfarid)}
.reader h4.kull .en,.reader h4.khushah .en,.reader h4.munfarid .en{display:none}
.reader h5{font-size:17px;color:var(--soft);margin:14px 0 2px;font-weight:400}
.reader p{margin:10px 0;line-height:2.4}
.reader ul,.reader ol{margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.reader ul{list-style:none}
.reader ol{padding-inline-start:28px}
.reader li{position:relative;padding:6px 14px 10px;border-radius:8px;line-height:2.4;transition:opacity .2s,background .2s}
.reader li:hover{background:var(--paper)}
.reader strong{font-weight:400;color:var(--accent)}
.fmeta{font-family:var(--f-x);font-size:12.5px;color:var(--faint);line-height:1.8;margin-bottom:4px}
.fmeta .sch{font-family:var(--f-ur);font-size:14px}
.plan-bab{margin:24px 0 4px;font-size:19px}
.plan-bab a{text-decoration:none}

/* scholar marks */
.lh{display:inline-flex;align-items:center;gap:6px;margin-inline-end:6px;vertical-align:1px}
.dots{display:inline-flex;gap:3px}
.d{width:11px;height:11px;border-radius:50%;display:inline-block}
.d.mm{background:var(--mm)}.d.ah{background:var(--ah)}.d.js{background:var(--js)}.d.ez{background:var(--ez)}
.pid{font-family:var(--f-x);font-size:11px;color:var(--faint);direction:ltr;unicode-bidi:isolate;display:none}
.reader li:has(>.lh[data-n="1"][data-s="mm"]){background:var(--mm-w);border-inline-start:4px solid var(--mm)}
.reader li:has(>.lh[data-n="1"][data-s="ah"]){background:var(--ah-w);border-inline-start:4px solid var(--ah)}
.reader li:has(>.lh[data-n="1"][data-s="js"]){background:var(--js-w);border-inline-start:4px solid var(--js)}
.reader li:has(>.lh[data-n="1"][data-s="ez"]){background:var(--ez-w);border-inline-start:4px solid var(--ez)}
.reader li:has(>.lh[data-n="1"]:not(.box)) .dots{display:none}
.who-h{font-size:18px;margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.who-h::before{content:"";width:11px;height:11px;border-radius:50%;background:currentColor}
.who-h.mm,.sch.mm{color:var(--mm)}.who-h.ah,.sch.ah{color:var(--ah)}.who-h.js,.sch.js{color:var(--js)}.who-h.ez,.sch.ez{color:var(--ez)}
.lh.box .sch{font-size:17px}
.tail{font-size:.72em;color:var(--faint);line-height:2}
.ref{font-family:var(--f-x);font-size:12px;color:var(--soft);direction:ltr;unicode-bidi:isolate;text-decoration:none}
a.ref{color:var(--accent);border-bottom:1px dotted currentColor;padding:2px 0}
.step{font-family:var(--f-x);font-size:11px;font-weight:600;color:var(--soft);border:1px solid var(--rule);border-radius:4px;padding:0 5px;direction:ltr;unicode-bidi:isolate}
.flag{font-size:14px;padding:0 8px 3px;border-radius:4px;border:1.5px solid var(--flag);color:var(--flag)}
.flag.km{background:var(--flag);color:var(--paper)}
.rule-all,.rule-diff{display:inline-block;font-size:.85em;color:var(--soft);margin-inline-end:6px;font-weight:400}
.rule-diff{color:var(--accent)}

section.hadd,section.km,section.mt{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:6px 18px 12px;margin:18px 0}
section.km,section.mt{border:2px solid var(--flag)}
section.hadd h4,section.km h4,section.mt h4{font-size:21px;margin-top:10px}

.tbl{overflow-x:auto;margin:14px 0}
.reader table{border-collapse:collapse;width:100%;font-size:.86em}
.reader th{font-weight:400;color:var(--soft);font-size:14px;text-align:right;border-bottom:2px solid var(--rule);padding:4px 8px}
.reader td{border-bottom:1px solid var(--wash);padding:4px 8px;vertical-align:top;line-height:2.2}
.reader td .sch{font-size:0;display:inline-block;width:11px;height:11px;border-radius:50%;background:currentColor;margin:0 2px;vertical-align:middle}
.reader td [lang="en"],.reader td:has(>[lang="en"]){color:var(--faint)}

body.meta .pid{display:inline}
body.meta .tail{font-size:.82em;color:var(--soft)}

body[data-focus] .reader li:has(>.lh){opacity:.22}
body[data-focus="mm"] .reader li:has(>.lh[data-s~="mm"]),body[data-focus="ah"] .reader li:has(>.lh[data-s~="ah"]),
body[data-focus="js"] .reader li:has(>.lh[data-s~="js"]),body[data-focus="ez"] .reader li:has(>.lh[data-s~="ez"]){opacity:1}

.keys{font-family:var(--f-x);font-size:12.5px;color:var(--faint);margin-top:28px;line-height:2}
kbd{font-family:var(--f-x);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
.loading{color:var(--soft);font-size:17px;padding:40px 0}
.railbtn{display:none}
@media (max-width:960px){
  .page{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .reader h1{font-size:28px}.reader h3{font-size:23px}
  .brand small{display:none}
  .dock .now{max-width:30vw}
}
@media (max-width:560px){
  .dock .lbl{display:none}
  body.inpage .brand{display:none}
  .row2{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px}
  .row2::-webkit-scrollbar{display:none}
  .legend,.tools{flex-wrap:nowrap;flex:none}
  .bar .btn{min-height:36px;padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>html,body{margin:0}:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}@media (prefers-color-scheme:dark){:root{color-scheme:dark}}[hidden]{display:none!important}</style>
</head>

<a class="skip" href="#app">مواد پر جائیں</a>
<header class="bar">
  <div class="bar-in">
    <button class="btn" id="tocBtn" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>فہرست</span></button>
    <a class="brand" href="#b06"><b>مکارم الاخلاق اطلس</b></a>
    <nav class="crumb" aria-label="باب سے باب">
      <a class="btn" id="prevCh" aria-label="پچھلا باب" title="پچھلا باب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
      <span class="where" id="where" aria-live="polite"></span>
      <a class="btn" id="nextCh" aria-label="اگلا باب" title="اگلا باب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    </nav>
  </div>
  <div class="row2">
    <div class="legend" role="group" aria-label="ایک عالم کے نکات نمایاں کریں">
      <button class="mm" id="f-mm" data-s="mm" aria-pressed="false"><i aria-hidden="true"></i>میرزا مہدی</button>
      <button class="ah" id="f-ah" data-s="ah" aria-pressed="false"><i aria-hidden="true"></i>حلبی</button>
      <button class="js" id="f-js" data-s="js" aria-pressed="false"><i aria-hidden="true"></i>سیدان</button>
      <button class="ez" id="f-ez" data-s="ez" aria-pressed="false"><i aria-hidden="true"></i>افتخارزادہ</button>
    </div>
    <div class="tools">
      <button class="btn" id="smaller" aria-label="حروف چھوٹے کریں">A−</button>
      <button class="btn" id="bigger" aria-label="حروف بڑے کریں">A+</button>
      <button class="btn" id="metaT" aria-pressed="false" title="ids, steps and notes">تفصیل</button>
    </div>
  </div>
</header>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="فہرست" hidden>
  <div class="scrim" id="scrim"></div>
  <nav class="panel" id="panel" aria-label="پوری فہرست"></nav>
</div>

<main class="wrap" id="app" tabindex="-1" lang="ur"><div class="loading" role="status">لوڈ ہو رہا ہے</div></main>

<div class="dock" id="dock" hidden><div class="dock-in" role="navigation" aria-label="فصل سے فصل">
  <button class="btn" id="prevF" aria-label="پچھلی فصل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="lbl">پچھلی</span></button>
  <span class="now" id="now"></span>
  <button class="btn" id="nextF" aria-label="اگلی فصل"><span class="lbl">اگلی</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="btn" id="topB" aria-label="اوپر جائیں"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
</div></div>

<script>
document.documentElement.lang='ur';document.documentElement.dir='rtl';
const $=id=>document.getElementById(id), app=$('app');
let D=null, ORDER=[], cur=null, cache={}, heads=[], curHead=-1;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=s=>s.split(/[؛:(«]/)[0].replace(/،\s*$/,'').trim();
const PARTS=[['حصۂ اول: مقدمہ اور جڑیں','Babs 1 to 9',1,9],['حصۂ دوم: اخلاق و صفات','Babs 10 to 15',10,15],['حصۂ سوم: لوگوں کے ساتھ برتاؤ، پہلے امام','Babs 16 to 19',16,19]];

/* settings */
let fs=+store.get('fs')||19;
const setFs=v=>{fs=Math.min(26,Math.max(15,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs)};
setFs(fs);
$('smaller').onclick=()=>setFs(fs-1);$('bigger').onclick=()=>setFs(fs+1);
const setMeta=on=>{document.body.classList.toggle('meta',on);$('metaT').setAttribute('aria-pressed',on);store.set('meta',on?'1':'0')};
setMeta(store.get('meta')==='1');$('metaT').onclick=()=>setMeta(!document.body.classList.contains('meta'));
document.querySelectorAll('.legend button').forEach(b=>b.addEventListener('click',()=>{
  const on=b.getAttribute('aria-pressed')!=='true';
  document.querySelectorAll('.legend button').forEach(x=>x.setAttribute('aria-pressed','false'));
  if(on){b.setAttribute('aria-pressed','true');document.body.dataset.focus=b.dataset.s}else delete document.body.dataset.focus;
}));

/* pages: intro, plan, b01..b19 */
const pageMeta=id=>D.docs[id]?{id,ur:D.docs[id].ur,en:D.docs[id].en,n:id==='intro'?'Vol 1':'Vol 2'}:(()=>{const b=D.babs.find(x=>x.id===id);return b&&{id,ur:b.ur,en:b.en,n:'Bab '+(+id.slice(1))}})();

/* drawer */
let lastFocus=null;
function buildDrawer(){
  const li=(id,n,t)=>`<li><a href="#${id}" data-p="${id}"><small>${n}</small><span>${esc(t)}</span></a></li>`;
  $('panel').innerHTML=`<div class="head"><b>فہرست</b><button class="btn" id="closeD" aria-label="فہرست بند کریں">✕</button></div>
    ${PARTS.filter(p=>D.babs.some(b=>{const n=+b.id.slice(1);return n>=p[2]&&n<=p[3]})).map(p=>`<h2>${p[0]}</h2><ol>${D.babs.filter(b=>{const n=+b.id.slice(1);return n>=p[2]&&n<=p[3]}).map(b=>li(b.id,+b.id.slice(1),b.ur)).join('')}</ol>`).join('')}`;
  $('closeD').onclick=closeDrawer;
}
function openDrawer(){lastFocus=document.activeElement;$('drawer').hidden=false;$('tocBtn').setAttribute('aria-expanded','true');
  $('panel').querySelectorAll('a').forEach(a=>a.toggleAttribute('aria-current',false));
  const c=$('panel').querySelector(`a[data-p="${cur||''}"]`);if(c){c.setAttribute('aria-current','page');c.scrollIntoView({block:'center'})}
  $('panel').querySelectorAll('.sub').forEach(x=>x.remove());
  const r=document.querySelector('.rail');
  if(c&&cur&&r){const d=document.createElement('div');d.className='sub';d.innerHTML=r.innerHTML;d.querySelectorAll('.on').forEach(a=>a.classList.remove('on'));c.parentElement.append(d)}
  (c||$('closeD')).focus()}
function closeDrawer(){$('drawer').hidden=true;$('tocBtn').setAttribute('aria-expanded','false');lastFocus&&lastFocus.focus()}
$('tocBtn').onclick=openDrawer;$('scrim').onclick=closeDrawer;
$('panel').addEventListener('click',e=>{if(e.target.closest('a'))closeDrawer()});
$('drawer').addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return}
  if(e.key==='Tab'){const f=[...$('panel').querySelectorAll('a,button')];const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}
});

/* chrome per page */
function chrome(){
  const i=ORDER.indexOf(cur), p=ORDER[i-1], n=ORDER[i+1];
  const set=(el,id)=>{if(id!==undefined&&i>=0){el.href='#'+id;el.removeAttribute('aria-disabled');el.title=el.getAttribute('aria-label')+': '+pageMeta(id).ur}else{el.removeAttribute('href');el.setAttribute('aria-disabled','true')}};
  set($('prevCh'),p);set($('nextCh'),n);
  $('where').textContent=cur?pageMeta(cur).n.replace('Bab','باب').replace('Vol','جلد')+' · '+pageMeta(cur).ur:'';
  $('dock').hidden=!cur;document.body.classList.toggle('inpage',!!cur);
}

function home(){
  cur=null;chrome();
  const last=store.get('last'), lm=last&&pageMeta(last.split('-')[0]);
  const total=D.babs.reduce((a,b)=>a+b.points,0), fas=D.babs.reduce((a,b)=>a+b.fasls.length,0);
  const card=b=>{const t=b.sch.mm+b.sch.ah+b.sch.js+b.sch.ez||1;
    const names={mm:'میرزا مہدی',ah:'حلبی',js:'سیدان',ez:'افتخارزادہ'};
    const bar=['mm','ah','js','ez'].map(s=>`<i class="${s}" style="width:${(b.sch[s]/t*100).toFixed(1)}%"></i>`).join('');
    const label=['mm','ah','js','ez'].map(s=>`${names[s]} ${Math.round(b.sch[s]/t*100)} فیصد`).join('، ');
    return `<li><a class="card" href="#${b.id}"><span class="n">BAB ${+b.id.slice(1)}</span><h3>${b.ur}</h3><span class="en" lang="en">${esc(b.en)}</span>
      <p>${esc(b.lede)}</p><div class="share" role="img" aria-label="${label}">${bar}</div>
      <div class="cnt" lang="en"><span>${b.fasls.length} Fasls</span><span>${b.points} points</span><span>${b.limits} limits</span>${b.contra?`<span>${b.contra} contradictions</span>`:''}</div></a></li>`};
  app.innerHTML=`<div class="home"><div class="hero">
    <h1 tabindex="-1">چار علما، اخلاق کے انیس ابواب</h1>
    <p>میرزا مہدی اصفہانی، شیخ محمود حلبی، سید جعفر سیدان اور سید حسن افتخارزادہ اخلاق پر کیا کہتے ہیں: ہر باب میں پہلے وہ جس پر سب متفق ہیں، پھر جو ایک خوشہ بڑھاتا ہے، پھر جو ایک عالم اکیلا کہتا ہے۔ ہر نکتے کے ساتھ رنگین نشان بتاتے ہیں کہ یہ بات کس کی ہے۔</p>
    <div class="en" lang="en">${D.babs.length} chapters · ${fas} unified Fasls · ${total.toLocaleString('en')} points</div></div>
    ${lm?`<div class="continue"><a class="btn" href="#${esc(last)}">جہاں چھوڑا تھا وہاں سے پڑھیں: ${esc(lm.ur)}</a></div>`:''}
    <div class="part"><h2>پہلے یہ پڑھیں</h2><span lang="en">Volumes 1 and 2</span></div>
    <ul class="grid">
      <li><a class="card vol" href="#intro"><span class="n">VOLUME 1</span><h3>${D.docs.intro.ur}</h3><span class="en" lang="en">The atlas, the four scholars and their two clusters, the four teaching steps, the nineteen chapters, the fault lines</span></a></li>
      <li><a class="card vol" href="#plan"><span class="n">VOLUME 2</span><h3>${D.docs.plan.ur}</h3><span class="en" lang="en">All 489 Fasls in teaching order, step by step, each with the scholar to open it with</span></a></li>
    </ul>
    ${PARTS.map(p=>`<div class="part"><h2>${p[0]}</h2><span lang="en">${p[1]}</span></div><ul class="grid">${D.babs.filter(b=>{const n=+b.id.slice(1);return n>=p[2]&&n<=p[3]}).map(card).join('')}</ul>`).join('')}
  </div>`;
}

async function page(id,anchor){
  const m=pageMeta(id); if(!m){home();return}
  if(cur!==id){
    cur=id;chrome();
    app.innerHTML='<div class="loading" role="status">لوڈ ہو رہا ہے</div>';
    let h=cache[id];
    if(!h){try{h=await (await fetch(`data/${id}.html`)).text();cache[id]=h}catch(e){app.innerHTML='<div class="loading" role="alert">یہ حصہ لوڈ نہیں ہو سکا۔ دوبارہ کوشش کریں۔</div>';return}}
    if(cur!==id)return;
    const isDoc=!!D.docs[id], i=ORDER.indexOf(id), prev=ORDER[i-1], next=ORDER[i+1];
    let rail;
    if(isDoc){
      rail=`<h2>${m.n}</h2><ol>${D.docs[id].toc.map(t=>`<li><a href="#${t[0]}" data-a="${t[0]}" class="l${t[1]}"><span>${esc(t[2])}</span></a></li>`).join('')}</ol>`;
    }else{
      const b=D.babs.find(x=>x.id===id);
      rail=`<ol><li><a href="#${id}-glance" data-a="${id}-glance"><small></small>ایک نظر میں</a></li></ol>
        <h2>Fasls</h2><ol>${b.fasls.map(f=>`<li><a href="#${id}-${f[0]}" data-a="${id}-${f[0]}"><small>${f[1]}</small><span>${esc(short(f[2]))}</span></a></li>`).join('')}</ol>
        <h2>Boxes</h2><ol>${b.contra?`<li><a href="#${id}-contra" data-a="${id}-contra"><small>${b.contra}</small>تضادات</a></li>`:''}
        <li><a href="#${id}-limits" data-a="${id}-limits"><small>${b.limits}</small>حدود</a></li>
        <li><a href="#${id}-care" data-a="${id}-care"><small></small>احتیاط سے پڑھیں</a></li></ol>`;
    }
    const pg=(pid,cls,lab)=>{const pm=pageMeta(pid);return `<a class="${cls}" href="#${pid}"><small>${lab}</small><span>${esc(pm.ur)}</span></a>`};
    app.innerHTML=`<div class="page"><nav class="rail" aria-label="اس حصے کی فہرست">${rail}</nav>
      <article class="reader">${h}
      <nav class="pager" aria-label="پچھلا اور اگلا حصہ">${prev?pg(prev,'prev','→ پچھلا'):''}${next?pg(next,'next','اگلا ←'):''}</nav>
      <p class="keys" lang="en">Keys: <kbd>←</kbd> next Fasl · <kbd>→</kbd> previous Fasl · <kbd>Shift</kbd> + arrow: next or previous chapter · <kbd>T</kbd> contents</p></article></div>`;
    app.querySelectorAll('.reader table').forEach(t=>{const w=document.createElement('div');w.className='tbl';w.tabIndex=0;w.setAttribute('role','region');w.setAttribute('aria-label','جدول');t.before(w);w.append(t)});
    const h1=app.querySelector('.reader h1');if(h1)h1.tabIndex=-1;
    heads=[...app.querySelectorAll(isDoc?'.reader h2[id],.reader h3[id]':'.reader h2[id$="-glance"],.reader h3[id],.reader h2[id$="-contra"],.reader h2[id$="-limits"],.reader h2[id$="-care"]')];
    observe();
    if(!anchor){window.scrollTo(0,0);(h1||app).focus({preventScroll:true})}
  }
  if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView({block:'start'});if(!el.hasAttribute('tabindex'))el.tabIndex=-1;el.focus({preventScroll:true})}}
}

let io;
function observe(){
  io&&io.disconnect();
  const links=[...document.querySelectorAll('.rail a[data-a]')];
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    curHead=heads.indexOf(e.target);
    links.forEach(l=>l.classList.toggle('on',l.dataset.a===e.target.id));
    const on=links.find(l=>l.dataset.a===e.target.id);on&&on.scrollIntoView({block:'nearest'});
    $('now').textContent=short(e.target.querySelector('.ur')?.textContent||'');
    store.set('last',e.target.id);
  }})},{rootMargin:'-130px 0px -65% 0px'});
  heads.forEach(h=>io.observe(h));
  curHead=-1;$('now').textContent=pageMeta(cur).ur;
}
function stepHead(d){
  if(!heads.length)return;
  let i=curHead+d; if(curHead<0)i=d>0?0:-1;
  if(i<0){window.scrollTo({top:0});return}
  if(i>=heads.length){const n=ORDER[ORDER.indexOf(cur)+1];if(n)location.hash=n;return}
  location.hash=heads[i].id;
}
$('prevF').onclick=()=>stepHead(-1);$('nextF').onclick=()=>stepHead(1);
$('topB').onclick=()=>{window.scrollTo({top:0});app.querySelector('.reader h1')?.focus({preventScroll:true})};
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]')||e.ctrlKey||e.metaKey||e.altKey||!$('drawer').hidden)return;
  if(e.key==='t'||e.key==='T'){e.preventDefault();openDrawer();return}
  if(!cur)return;
  const i=ORDER.indexOf(cur);
  if(e.key==='ArrowLeft'){e.preventDefault();if(e.shiftKey){ORDER[i+1]&&(location.hash=ORDER[i+1])}else stepHead(1)}
  if(e.key==='ArrowRight'){e.preventDefault();if(e.shiftKey){ORDER[i-1]&&(location.hash=ORDER[i-1])}else stepHead(-1)}
});

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h){page(ORDER[0]);return}
  const id=h.split('-')[0];
  if(!pageMeta(id)){page(ORDER[0]);return}
  page(id,h.includes('-')?h:null);
}
fetch('data/index.json').then(r=>r.json()).then(d=>{D=d;ORDER=d.babs.map(b=>b.id);buildDrawer();route()})
  .catch(()=>{app.innerHTML='<div class="loading" role="alert">اطلس کا ڈیٹا لوڈ نہیں ہو سکا۔ صفحہ دوبارہ کھولیں۔</div>'});
addEventListener('hashchange',route);
</script>

</body>
</html>
